<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>پرونده‌های بیماران</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E6E}a:hover{color:#084F4F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F7; font-family: Vazirmatn, Tahoma, sans-serif; color: #15212B; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #52616B">کلینیک [نام کلینیک]</span>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">پرونده‌ها</h1>
      </div>
      <button aria-label="اعلان‌ها" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCE2E6; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15212B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DCE2E6; border-radius: 12px; padding: 0 14px; height: 46px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52616B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">جستجوی بیمار</span>
      <input type="search" placeholder="جستجوی نام یا شمارهٔ پرونده" style="border: 0; outline: 0; flex: 1; font-family: inherit; font-size: 14px; background: transparent; color: #15212B">
    </label>
    <a href="Capture.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: #0B6E6E; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      آنالیز بیمار جدید
    </a>
  </div>

  <div style="padding: 4px 20px 8px; display: flex; gap: 8px">
    <div style="flex: 1; background: #FFFFFF; border: 1px solid #DCE2E6; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #52616B">در انتظار تأیید</span>
      <span style="font-size: 20px; font-weight: 700">[—]</span>
    </div>
    <div style="flex: 1; background: #FFFFFF; border: 1px solid #DCE2E6; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #52616B">پیگیری این هفته</span>
      <span style="font-size: 20px; font-weight: 700">[—]</span>
    </div>
    <div style="flex: 1; background: #FBEEDF; border: 1px solid #F0D4B4; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #7A3A06">نیاز به تجدید</span>
      <span style="font-size: 20px; font-weight: 700; color: #7A3A06">[—]</span>
    </div>
  </div>

  <div style="padding: 12px 20px 6px; display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-size: 16px; font-weight: 600">اخیر</h2>
    <a href="#" style="font-size: 13px">همه</a>
  </div>

  <div style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{patients}}" as="p" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border: 1px solid #DCE2E6; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 22px; background: #E3F1F0; color: #0B6E6E; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">{{p.initial}}</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #52616B">{{p.meta}}</span>
        </div>
        <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{p.chipBg}}; color: {{p.chipFg}}">{{p.status}}</span>
      </div>
    </sc-for>
  </div>

  <nav aria-label="منوی اصلی" style="height: 72px; background: #FFFFFF; border-top: 1px solid #DCE2E6; display: flex; justify-content: space-around; align-items: center">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: #0B6E6E; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E6E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
      پرونده‌ها
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: #52616B; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#52616B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>
      کتابخانهٔ درمان
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: #52616B; text-decoration: none; min-width: 64px; padding: 6px 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#52616B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
      تنظیمات
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (s) => s === 'در انتظار تأیید'
      ? { chipBg: '#FBEEDF', chipFg: '#7A3A06' }
      : s === 'پیگیری'
        ? { chipBg: '#E3F1F0', chipFg: '#0B5A5A' }
        : { chipBg: '#EEF1F3', chipFg: '#3B4851' };
    const rows = [
      { initial: 'ب', name: 'بیمار [شمارهٔ پرونده]', meta: 'آنالیز امروز · ۱۱ نما', status: 'در انتظار تأیید' },
      { initial: 'ب', name: 'بیمار [شمارهٔ پرونده]', meta: 'جلسهٔ دوم از سه · فیلر ساختاری', status: 'پیگیری' },
      { initial: 'ب', name: 'بیمار [شمارهٔ پرونده]', meta: 'گزارش ارسال شد', status: 'کامل' },
      { initial: 'ب', name: 'بیمار [شمارهٔ پرونده]', meta: 'توکسین · موعد تجدید نزدیک است', status: 'پیگیری' }
    ];
    return { patients: rows.map(r => ({ ...r, ...tag(r.status) })) };
  }
}
</script>
</body>
</html>
