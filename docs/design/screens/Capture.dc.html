<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>عکاسی هدایت‌شده</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FD6D3}a:hover{color:#B5ECEA}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0F171D; font-family: Vazirmatn, Tahoma, sans-serif; color: #F2F5F7; display: flex; flex-direction: column">
  <div style="padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="بازگشت" style="width: 44px; height: 44px; border-radius: 12px; background: #1C2830; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">نمای 2 از 11 · 45 درجه راست</span>
      <span style="font-size: 12px; color: #A9B6BF">حالت خنثی، سر کمی به چپ</span>
    </div>
    <button aria-label="راهنمای این نما" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1C2830; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F7" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.1"/></svg>
    </button>
  </div>

  <div style="margin: 0 16px; height: 430px; border-radius: 20px; background: #1A252D; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <svg width="260" height="340" viewBox="0 0 260 340" role="img" aria-label="ماسک راهنمای چهره در زاویهٔ 45 درجه">
      <ellipse cx="130" cy="160" rx="96" ry="128" fill="none" stroke="#7FD6D3" stroke-width="2.5" stroke-dasharray="8 6"/>
      <path d="M78 120c10-8 26-10 38-6M150 116c12-4 26-2 36 6" fill="none" stroke="#C9D3D9" stroke-width="2" stroke-linecap="round"/>
      <path d="M86 140c8-5 20-5 28 0M152 140c8-5 20-5 28 0" fill="none" stroke="#C9D3D9" stroke-width="2" stroke-linecap="round"/>
      <path d="M136 140c-4 22-10 40-14 52 6 4 16 4 22 0" fill="none" stroke="#C9D3D9" stroke-width="2" stroke-linecap="round"/>
      <path d="M104 226c14 8 40 8 56 0M108 226c16-6 34-6 48 0" fill="none" stroke="#C9D3D9" stroke-width="2" stroke-linecap="round"/>
      <path d="M48 170c4 50 30 98 82 116 52-18 78-66 82-116" fill="none" stroke="#C9D3D9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <g fill="#7FD6D3">
        <circle cx="94" cy="140" r="2.5"/><circle cx="110" cy="140" r="2.5"/><circle cx="160" cy="140" r="2.5"/><circle cx="176" cy="140" r="2.5"/>
        <circle cx="122" cy="192" r="2.5"/><circle cx="144" cy="192" r="2.5"/><circle cx="104" cy="226" r="2.5"/><circle cx="160" cy="226" r="2.5"/>
        <circle cx="130" cy="284" r="2.5"/><circle cx="62" cy="214" r="2.5"/><circle cx="198" cy="214" r="2.5"/><circle cx="80" cy="176" r="2.5"/><circle cx="182" cy="176" r="2.5"/>
      </g>
    </svg>
    <div style="position: absolute; top: 14px; right: 14px; background: rgba(15,23,29,0.85); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: #F2F5F7">yaw 43° · pitch 1° · roll 0°</div>
  </div>

  <div style="margin: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: #13534F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7FD6D3" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      زاویه در محدوده (±3 درجه)
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: #13534F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7FD6D3" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      فاصله و اندازهٔ صورت مناسب
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #F7C38C">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: #4A2A0C; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F7C38C" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17v.1"/></svg></span>
      نور سمت چپ زیاد است؛ کمی به سمت پنجره بچرخید
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 16px 10px; display: flex; gap: 6px; justify-content: center">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="11">
      <span style="width: 24px; height: 6px; border-radius: 3px; background: {{v.bg}}"></span>
    </sc-for>
  </div>
  <div style="padding: 0 16px 24px; display: flex; align-items: center; justify-content: space-between">
    <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #33424C; background: transparent; color: #F2F5F7; font-family: inherit; font-size: 14px">ویدیوی چرخش (اختیاری)</button>
    <button aria-label="گرفتن عکس، پس از اصلاح نور فعال می‌شود" disabled style="width: 76px; height: 76px; border-radius: 38px; border: 4px solid #4C5A63; background: #2A363E"></button>
    <a href="Analysis.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: #1C2830; color: #F2F5F7; font-size: 14px; display: flex; align-items: center; text-decoration: none">ادامه</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const views = Array.from({ length: 11 }, (_, i) => ({ bg: i === 0 ? '#7FD6D3' : i === 1 ? '#F2F5F7' : '#33424C' }));
    return { views };
  }
}
</script>
</body>
</html>
